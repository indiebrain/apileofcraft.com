<header class="site-header">
  <div class="wrap site-header__inner">
    <p class="site-brand">
      <a href="{{ "/" | relURL }}" class="site-brand__link">
        <span class="site-brand__text">
          <span class="site-brand__name">{{ site.Title }}</span>
          <span class="site-brand__tagline">{{ site.Params.tagline }}</span>
        </span>
      </a>
    </p>
    <nav class="site-nav" aria-label="Primary">
      <ul class="site-nav__list">
        {{ range site.Menus.main }}
          {{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
          <li class="site-nav__item">
            <a href="{{ .URL }}" class="site-nav__link"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
        {{ end }}
      </ul>
    </nav>
    {{ partial "theme-toggle.html" . }}
  </div>
</header>
